<!DOCTYPE html>
<html lang="es-ES">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="estilo.css">
      <link rel="icon" href="loguo.ico" type="image/x-icon">
      <title>SYMPHONIC METAL</title>
<style>
    body, html {
        color: #ff9898; 
        width: 100%; /* Cambiado de 100vw para evitar desbordamiento */
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        background: url(fondo.jpg) center center fixed;
        background-size: cover;
        overflow-x: hidden; 
        font-family: 'Courier New', monospace;
    } 

    .contenedor {
        position: relative;
        z-index: 10; 
        text-align: center;
        padding: 60px 15px; /* Espacio lateral para que no toque los bordes */
        width: 100%;
        max-width: 600px; /* Evita que se estire demasiado en PC */
        box-sizing: border-box;
    }

    /* CONTENEDOR DE BOTONES: La clave para el orden */
    .grupo-botones {
        display: flex;
        flex-wrap: wrap; /* Permite que se pongan en pares o solos */
        justify-content: center;
        gap: 10px; /* Espacio entre botones */
        margin-top: 20px;
    }

.boton-redireccion {
    /* Cambiamos flex por inline-block para que fluyan como palabras en un párrafo */
    display: inline-block; 
    margin: 8px 5px; /* 8px arriba/abajo y 5px a los lados para separarlos */
    padding: 12px 24px;
    background-color: #0b0b0b;
    color: #ff5555;
    font-weight: bold;
    border: 2px solid #ff5555;
    border-radius: 8px;
    text-decoration: none;
    text-align: center; 
    cursor: pointer;
    transition: 0.3s;
    
    /* Esto evita que se vuelvan gigantes en móvil */
    vertical-align: top;
}

    /* Ajuste para el subrayado largo de tu h2 */
    h2 {
        color: red;
        font-size: 1.2rem;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        margin: 10px 0;
    }

    h1 {
        color: red;
        text-shadow: 0 0 30px hsl(0, 100%, 50%);
        font-size: 1.8rem;
    }

    .imagen-interna {
        display: block;
        margin: 30px auto;       
        width: 80%; /* Adaptable al celular */
        max-width: 350px;           
        transition: transform 0.5s ease;
    }

    /* Animación Bounce */
    .bounce {
        animation: bounce 1s infinite;
    }

    @keyframes bounce {
        0%, 100% {transform: translateY(0);}
        50% {transform: translateY(-5px);}
    }
</style>
   </head>
   <body>
     <div class="contenedor">
       <header>
         <h1>SYMPHONIC METAL</h1>
         <h2>_____________________________________________________</h2>
       </header> 
       <p>Se caracteriza por sus instrumentos que parecen orquestas</p>
       <p>es mas utilizado cuando hay una cantante femenina en la banda.</P>
        <div class="grupo-botones">        
          <a href="index.html" class="boton-redireccion bounce">VOLVER</a>
         <a href="https://www.youtube.com/watch?v=Mw5DARjox-8&list=PLyfdcPAm09pVfeAhx1WJmOxLULp0JBfm0&index=2" 
            class="boton-redireccion bounce" 
            target="_blank">
            NIGHTWISH 
         </a>
         <a href="https://www.youtube.com/watch?v=mf97F-SpBQU&list=PLSkWWW7aQ_1AtIMRPaqo7XV0UZjg-6fa6&index=1" 
           class="boton-redireccion bounce" 
           target="_blank">
           WITHIN TEMPTATION
         </a>
         <a href="https://www.youtube.com/watch?v=_8g3bSHhKpE&list=PLg6zA61oVsU08CUntpMQqr5rGsySl0UXP&index=1" 
           class="boton-redireccion bounce" 
           target="_blank">
            EPICA
         </a>
         <img src="g5.png" alt="gif" class="imagen-interna" id="g5">
        </div>
        </div>
              <script>
  const audio = new Audio("audio/album.mp3");
  audio.volume = 0.6; 

  const casette = document.getElementById("g5");

  casette.addEventListener("click", () => {
    if (audio.paused) {
      audio.play();
      casette.style.filter = "drop-shadow(0 0 15px #ff5555)";
    } else {
      audio.pause();
      casette.style.filter = "none";
    }
  });
</script>
   </body>
</html>
